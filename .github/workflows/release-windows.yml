name: Release (Windows shell)

# Builds the PalmierWin editor, packages it as an Inno Setup installer (plus a
# portable zip), and publishes both as a GitHub prerelease. Manual trigger
# with a version input; also runs on v*-win tags.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
  push:
    tags: ["v*-win"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if ($env:GITHUB_REF_TYPE -eq "tag") { $ver = $env:GITHUB_REF_NAME -replace "^v","" -replace "-win$","" }
          echo "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Setup Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Link PalmierCore into PalmierWin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path PalmierWin/Sources | Out-Null
          $coreSrc = (Resolve-Path "Sources/PalmierCore").Path
          New-Item -ItemType SymbolicLink -Path "PalmierWin/Sources/PalmierCore" -Value $coreSrc | Out-Null

      - name: Fetch Windows media deps
        shell: pwsh
        run: |
          Push-Location PalmierWin
          ./fetch-deps.ps1
          Pop-Location

      - name: Build PalmierCoreHost (release)
        shell: pwsh
        run: |
          Push-Location PalmierWin
          swift build -c release --product PalmierCoreHost
          Pop-Location

      - name: Publish shell (self-contained win-x64)
        shell: pwsh
        run: |
          Push-Location PalmierWin/Shell
          dotnet publish PalmierShell -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -o publish
          Pop-Location

      - name: Stage the portable package
        shell: pwsh
        run: |
          $stage = "PalmierWin/Shell/publish"
          $release = "PalmierWin/.build/x86_64-unknown-windows-msvc/release"
          Copy-Item "$release/PalmierCoreHost.dll" $stage
          Copy-Item "PalmierWin/ThirdParty/ffmpeg/bin/*.dll" $stage
          # Swift runtime DLLs: locate the installed runtime by its
          # swiftCore.dll instead of deriving the path from the toolchain
          # layout — the Toolchains/Runtimes split varies between runners.
          $swiftCore = Get-ChildItem "$env:LOCALAPPDATA\Programs\Swift\Runtimes\*\usr\bin\swiftCore.dll" |
            Select-Object -First 1
          if (-not $swiftCore) { throw "Swift runtime not found under $env:LOCALAPPDATA\Programs\Swift\Runtimes" }
          Copy-Item "$($swiftCore.DirectoryName)\*.dll" $stage
          Get-ChildItem $stage | Measure-Object | ForEach-Object { "staged $($_.Count) files" }

      - name: Zip the package
        shell: pwsh
        run: |
          Compress-Archive -Path "PalmierWin/Shell/publish/*" -DestinationPath "PalmierWin-$env:VERSION-win-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$env:VERSION "PalmierWin\Shell\installer\PalmierWin.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
          Get-Item "PalmierWin\Shell\installer\output\PalmierWin-Setup-$env:VERSION.exe" |
            ForEach-Object { "installer: $($_.FullName) ($([math]::Round($_.Length / 1MB, 1)) MB)" }

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: PalmierWin v${{ env.VERSION }} (Windows prerelease)
          tag_name: v${{ env.VERSION }}-win
          prerelease: true
          files: |
            PalmierWin/Shell/installer/output/PalmierWin-Setup-${{ env.VERSION }}.exe
            PalmierWin-${{ env.VERSION }}-win-x64.zip
          body: |
            Windows x64 test build of PalmierWin.

            Download `PalmierWin-Setup-${{ env.VERSION }}.exe` and run it — no admin needed.
            The zip is the same build, unpackaged, for portable use. Needs a Vulkan-capable GPU.
            Session and crash logs land in `%APPDATA%\PalmierPro\logs\` — send them with any bug report.
